configuration:
  grocy_base_url:
    name: Grocy URL
    description: Base URL of your Grocy instance. For the community Grocy app use http://a0d7b954-grocy:80.
  grocy_api_key:
    name: Grocy API key
    description: Created in Grocy under Manage API keys.
  enable_ssl_verify:
    name: Verify SSL certificates
    description: Disable only for self-signed certificates.
  rest_response_size_limit:
    name: Dev tool response size limit
    description: Byte cap on the raw Grocy response returned by the system_dev_test_request developer tool (disabled by default). No effect on the other tools.
  home_assistant_discovery:
    name: Announce to Home Assistant
    description: 'auto: register with the Model Context Protocol integration on HA 2026.10+; core: always register; companion: register with the MCP Grocy (HACS) integration instead; off: add the URL manually.'
  enable_http_server:
    name: Enable HTTP server (legacy, ignored)
    description: Kept for compatibility with 2.x configurations; the server is always enabled.
  http_server_port:
    name: HTTP server port (legacy, ignored)
    description: Kept for compatibility with 2.x configurations; the container port is fixed to 8080, map a host port in the Network section instead.
network:
  8080/tcp: MCP endpoint (/mcp). Leave unmapped unless a client outside Home Assistant needs it.
